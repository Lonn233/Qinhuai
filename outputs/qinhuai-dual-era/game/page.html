<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#161e24"><meta name="description" content="走入秦淮灯会，寻五盏花灯，猜五道灯谜。第一人称灯会游园体验。">
 <title>上元秦淮 · 灯谜游园</title>
 <link rel="icon" href="data:,">
 <link rel="stylesheet" href="./game/festival.css">
</head>
<body>
 <div id="viewport"></div><div class="game-vignette" aria-hidden="true"></div>
 <header class="festival-header">
  <div class="festival-brand"><span class="brand-stamp" aria-hidden="true">上元</span><div><h1>上元秦淮</h1><p>灯火满城，等你入谜。</p></div></div>
  <nav class="festival-nav" aria-label="游园工具">
   <div class="era-controls" aria-label="时期切换"><button data-game-era="modern" aria-pressed="true">现代</button><span aria-hidden="true">/</span><button data-game-era="ming" aria-pressed="false">明初</button></div>
   <button id="weather-button" class="quiet-button">看日景</button><button id="overview-button" class="quiet-button">全景</button>
   <button id="catalog-button" class="catalog-button">花灯图鉴 <span id="catalog-count">0 / 5</span></button>
  </nav>
 </header>
 <div class="place-label"><span class="place-line" aria-hidden="true"></span><span>河前灯市</span><small>沿岸寻灯 · 灯下猜谜</small></div>
 <section id="game-intro" class="game-intro" aria-labelledby="intro-title"><p class="intro-kicker">今夜，做一个赏灯人。</p><h2 id="intro-title">一城灯火，<br>五次相逢。</h2><p class="intro-description">沿秦淮慢行，走近灯下的谜签。<br>猜中一个谜底，把一盏花灯收入图鉴。</p><button id="begin-festival" class="begin-button">步入灯市 <span aria-hidden="true">→</span></button><p class="intro-tip">建议使用键盘与鼠标体验</p></section>
 <div id="game-crosshair" class="game-crosshair" hidden aria-hidden="true"><span></span></div>
 <button id="interaction-prompt" class="interaction-prompt" hidden><kbd>E</kbd><span><strong id="interaction-title">查看灯谜</strong><small id="interaction-subtitle"></small></span></button>
 <button id="resume-explore" class="resume-explore" hidden>点击继续游园 <small>鼠标已释放 · B 打开图鉴</small></button>
 <button id="return-walk" class="return-walk" hidden>回到灯市 <span aria-hidden="true">→</span></button>
 <footer class="festival-footer"><div class="festival-status"><p id="collection-progress">已赏 0 盏 · 共 5 盏</p><span id="lantern-load-status" role="status">正在点亮花灯 0/5</span><button id="retry-lanterns" class="text-button" hidden>重试模型</button></div><div id="game-controls" class="game-controls" hidden><span><kbd>W A S D</kbd> 行走</span><span>鼠标 环顾</span><span><kbd>E</kbd> 猜谜</span><span><kbd>B</kbd> 图鉴</span><span><kbd>Esc</kbd> 释放鼠标</span></div><button id="help-button" class="help-button" aria-label="查看操作说明">?</button></footer>
 <div id="touch-controls" class="touch-controls" hidden aria-label="触屏方向控制"><button data-move="KeyW" aria-label="向前">↑</button><div><button data-move="KeyA" aria-label="向左">←</button><button data-move="KeyS" aria-label="向后">↓</button><button data-move="KeyD" aria-label="向右">→</button></div></div>
 <div id="game-notice" class="game-notice" role="status" aria-live="polite"></div>
 <dialog id="game-dialog" class="game-dialog" aria-labelledby="dialog-title"><button id="dialog-close" class="dialog-close" aria-label="关闭面板，返回灯市">×</button><div id="dialog-content"></div></dialog>
 <!-- Shared district viewer bindings remain intact; its authoring UI is not shown in game mode. -->
 <div id="legacy-controls" hidden>__LEGACY_CONTROLS__</div>
 <div id="asset-status" class="district-status" hidden role="status"><span id="asset-message"></span><button id="asset-retry" hidden>重新加载</button></div>
 <div id="loading" class="scene-loading"><span class="loading-seal">上元</span><strong>灯火将起</strong><p id="loading-message">正在铺开秦淮夜色…</p><button id="loading-retry" hidden>重新加载</button></div>
 <script>
 window.__QINHUAI_GAME_CONFIG__={externalAssets:{BRIDGE:'./game/assets/bridge.glb',PAVILION:'./game/assets/pavilion.glb',LOTUS_ONE:'./game/assets/lotus-one.glb',LOTUS_MAIN:'./game/assets/lotus-main.glb'}};
 (()=>{const $=id=>document.getElementById(id);let ready=false;const diagnostics=[];const update=message=>{if(!ready)$('loading-message').textContent=message;else{$('asset-status').hidden=false;$('asset-message').textContent=message;}};const fail=error=>{const message=error?.message||String(error);diagnostics.push(message);update(message);if(!ready)$('loading-retry').hidden=false;else $('asset-retry').hidden=false;};window.__QINHUAI_BOOT__={diagnostics,update,fail,ready(){ready=true;$('loading').hidden=true;},complete(){$('asset-status').hidden=true;}};$('loading-retry').onclick=$('asset-retry').onclick=()=>location.reload();addEventListener('error',e=>fail(e.error||e.message));addEventListener('unhandledrejection',e=>fail(e.reason));setTimeout(()=>{if(!ready){$('loading-message').textContent='场景准备时间较长，请重试或使用支持 WebGL 的桌面浏览器。';$('loading-retry').hidden=false;}},25000);})();
 </script>
 <script src="./game/festival.bundle.js" defer></script>
</body>
</html>
