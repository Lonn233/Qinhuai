<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>保护 Chrome 当前秦淮设置</title><link rel="stylesheet" href="/main-scene-persistence.css"><link rel="icon" href="data:,"><style>html{color-scheme:dark;background:#0c1520;color:#e5eaf0;font:15px/1.8 system-ui,"Microsoft YaHei",sans-serif}body{max-width:760px;margin:10vh auto;padding:24px}small{color:#d4ac70;letter-spacing:.18em}h1{font-size:30px;line-height:1.4;margin:16px 0}p{color:#adbbc8}.scene-save{padding:22px;font-size:14px}.scene-save button{padding:10px 14px}code{color:#d9c3a4}#capturedKeys{font-size:13px}a{color:#e0bd84}</style></head><body><small>秦淮 · 本机存档</small><h1>先保住 Chrome 里<br>已经调好的那一版。</h1><p>此页只读取本网站的项目设置，原样备份到这台电脑。不会上传默认值，不会修改当前 Chrome 的配色，也不会刷新你的主场景。可以保留此页，继续在原来的主地图调整，修改会同步存盘。</p><section id="scenePersistence" class="scene-save"></section><p id="capturedKeys"></p><p>看到「已写入文件」才表示保存成功。原始快照与历史版本在项目的 <code>.local-data</code> 文件夹中，不依赖 Chrome 缓存。</p><p><a href="/qinhuai-modern-import.html?time=night&view=riverfront&gateLight=gold" target="_blank" rel="noopener">另开主地图</a> · <strong>请不要关闭原来的场景，直到保存成功。</strong></p><script type="module">import {mountScenePersistence} from './main-scene-persistence.mjs';window.__QINHUAI_SCENE_SAVE__=mountScenePersistence({captureOnly:true});</script></body></html>
